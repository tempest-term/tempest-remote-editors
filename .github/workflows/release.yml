name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag/version mismatch")'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- lib
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: npm --prefix vscode ci --no-audit --no-fund
      - run: npm --prefix vscode run check
      - run: npm --prefix vscode test
      - run: npm run package:vscode
      - run: npm run package:cursor
      - run: ./gradlew buildPlugin --no-daemon
        working-directory: jetbrains
      - name: Publish all editor integrations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Tempest Remote Editors $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tempest Remote Editors $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip jetbrains/build/distributions/*.zip vscode/tempest-remote-*.vsix --clobber
