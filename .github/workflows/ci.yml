name: CI
on: [push, pull_request]
permissions:
  contents: read
  packages: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- lib
      - run: npm run check
      - run: npm test
      - run: npm run package
  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew buildPlugin --no-daemon
        working-directory: jetbrains
      - uses: actions/upload-artifact@v4
        with:
          name: tempest-remote-jetbrains
          path: jetbrains/build/distributions/*.zip
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: npm run package:cursor
      - uses: actions/upload-artifact@v4
        with:
          name: tempest-remote-vsix
          path: vscode/tempest-remote-*.vsix
